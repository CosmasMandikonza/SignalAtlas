name: signalatlas
x-edge: &edge
  build: .
  restart: unless-stopped
  depends_on:
    topology-api:
      condition: service_healthy
  networks: [telemetry]
  environment: &common-edge
    MQTT_HOST: broker
    MQTT_PORT: 1883
    PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-3}
services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infrastructure/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/docker/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - ./runtime/mosquitto/passwords:/mosquitto/config/passwords:ro
    networks: [telemetry]
  edge-a:
    <<: *edge
    environment:
      <<: *common-edge
      MQTT_USER: edge-a
      MQTT_PASSWORD: ${MQTT_EDGE_A_PASSWORD:?Set MQTT_EDGE_A_PASSWORD}
      BDSEQ_FILE: /state/edge-a.bdseq
    volumes: ["edge_a_state:/state"]
    command: ["python", "-m", "signalatlas.edge", "--node", "edge-a"]
  edge-b:
    <<: *edge
    environment:
      <<: *common-edge
      MQTT_USER: edge-b
      MQTT_PASSWORD: ${MQTT_EDGE_B_PASSWORD:?Set MQTT_EDGE_B_PASSWORD}
      BDSEQ_FILE: /state/edge-b.bdseq
    volumes: ["edge_b_state:/state"]
    command: ["python", "-m", "signalatlas.edge", "--node", "edge-b"]
  edge-c:
    <<: *edge
    environment:
      <<: *common-edge
      MQTT_USER: edge-c
      MQTT_PASSWORD: ${MQTT_EDGE_C_PASSWORD:?Set MQTT_EDGE_C_PASSWORD}
      BDSEQ_FILE: /state/edge-c.bdseq
    volumes: ["edge_c_state:/state"]
    command: ["python", "-m", "signalatlas.edge", "--node", "edge-c"]
  topology-api:
    build: .
    restart: unless-stopped
    depends_on:
      - broker
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["127.0.0.1:8000:8000"]
    networks: [telemetry]
    environment:
      SIGNALATLAS_RUNTIME: "1"
      MQTT_HOST: broker
      MQTT_USER: monitor
      MQTT_PASSWORD: ${MQTT_COLLECTOR_PASSWORD:?Set MQTT_COLLECTOR_PASSWORD}
      STALE_AFTER: ${STALE_AFTER:-12}
      OFFLINE_AFTER: ${OFFLINE_AFTER:-35}
      PG_MONITOR_DSN: "host=postgres port=5432 dbname=signalatlas user=monitor password=${POSTGRES_MONITOR_PASSWORD:?Set POSTGRES_MONITOR_PASSWORD}"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: signalatlas
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?Set POSTGRES_MONITOR_PASSWORD}
      POSTGRES_WRITER_PASSWORD: ${POSTGRES_WRITER_PASSWORD:?Set POSTGRES_WRITER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [telemetry]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalatlas"]
      interval: 5s
      timeout: 5s
      retries: 15
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [telemetry]
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [telemetry]
networks:
  telemetry:
    internal: false
volumes:
  postgres_data:
  grafana_data:
  edge_a_state:
  edge_b_state:
  edge_c_state:
