[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalatlas"
version = "0.1.0"
description = "Read-only synthetic industrial topology observability laboratory"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "paho-mqtt>=2.1,<3", "protobuf>=5,<7", "prometheus-client>=0.20,<1", "psycopg[binary]>=3.2,<4", "pydantic>=2,<3", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "pre-commit>=4,<5", "PyYAML>=6,<7"]

[project.scripts]
signalatlas-mqtt-status = "signalatlas.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

